# The tests on every push and pull request: Linux (Ubuntu 24.04, where the .deb is built) and Windows.
name: Tests

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
            python: "3.12"
          - os: ubuntu-24.04
            python: "3.14"
          - os: windows-latest
            python: "3.12"
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      # Linux: set up as the README says (./install.sh makes .venv; the bridge Claude starts runs from it)
      - name: Qt's system libraries, and the tools some tests use
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libdbus-1-3 xorriso desktop-file-utils
      - name: ./install.sh
        if: runner.os == 'Linux'
        run: ./install.sh

      - name: Python packages
        if: runner.os == 'Windows'
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Qt starts
        if: runner.os == 'Windows'
        run: python -I -c "from PySide6.QtWidgets import QApplication; app = QApplication([]); print('Qt', app.platformName())"

      # The tests skip what they cannot run; without openssl the certificate tests would be skipped, not failed.
      - name: openssl is there
        run: openssl version

      - name: Tests (Linux)
        if: runner.os == 'Linux'
        run: .venv/bin/python -I tools/run_tests.py
      - name: Tests (Windows)
        if: runner.os == 'Windows'
        run: python -I tools/run_tests.py
